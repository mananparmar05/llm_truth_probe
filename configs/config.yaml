# ============================================================
# LLM Hallucination Detection — Central Configuration
# ============================================================

# ── Model Settings ───────────────────────────────────────────
model:
  primary: "meta-llama/Llama-3.1-8B"
  secondary: "mistralai/Mistral-7B-v0.1"
  torch_dtype: "float16"          # fp16 to fit on A100/T4
  device_map: "auto"
  num_layers: 32
  hidden_dim: 4096

# ── Data ─────────────────────────────────────────────────────
data:
  truthfulqa_split: "generation"
  halueval_name: "pminervini/HaluEval"
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10
  random_seed: 42
  max_token_length: 512

# ── Paths ─────────────────────────────────────────────────────
paths:
  data_dir: "data/"
  hidden_states_dir: "data/hidden_states/"
  results_dir: "results/"
  plots_dir: "results/plots/"
  models_dir: "results/models/"

# ── Extraction ────────────────────────────────────────────────
extraction:
  batch_size: 8
  layers_to_extract: "all"        # or list e.g. [14, 15, 16]
  token_position: "last"          # "last" | "mean" | "first"
  storage_format: "hdf5"         # "hdf5" | "numpy"

# ── Probe Training ────────────────────────────────────────────
probing:
  probe_types:
    - "logistic_regression"
    - "mlp"
    - "svm"
    - "ensemble"
  logistic_regression:
    max_iter: 1000
    C: 1.0
    solver: "lbfgs"
  mlp:
    hidden_layer_sizes: [256, 64]
    activation: "relu"
    max_iter: 500
    dropout: 0.1
  svm:
    kernel: "rbf"
    C: 1.0
    probability: true
  cv_folds: 5

# ── Analysis ─────────────────────────────────────────────────
analysis:
  tsne:
    n_components: 2
    perplexity: 40
    n_iter: 1000
    random_state: 42
  best_layer: 14                  # 0-indexed, i.e. layer 15

# ── Experiment Tracking ──────────────────────────────────────
tracking:
  use_wandb: false
  wandb_project: "llm-hallucination-detection"
  use_mlflow: true
  mlflow_experiment: "hallucination_probes"

# ── Inference API ─────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8000
  hallucination_threshold: 0.70
  uncertain_threshold: 0.30
